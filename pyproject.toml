[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurophenotype-ml"
version = "0.1.0"
description = "Reproducible extracellular single-unit phenotype inference research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
electrophysiology = ["pyabf>=2.3", "h5py>=3.10", "pynwb>=2.7"]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
